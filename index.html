<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Desk Quotes</title>
  <meta name="description" content="An always-on slideshow of motivational quotes from thinkers, scientists, and writers.">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <meta name="theme-color" content="#FAF7F0">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Desk Quotes">

  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <link rel="preload" href="assets/fonts/latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main id="stage" aria-live="polite"></main>

  <canvas class="constellation-sky" id="constellation-sky" aria-hidden="true"></canvas>

  <div class="clock" id="clock" aria-hidden="true"></div>

  <button class="ctrl-settings" id="ctrl-settings" type="button" aria-label="Settings">Settings</button>

  <button class="ctrl-pomodoro" id="ctrl-pomodoro" type="button" aria-label="Start pomodoro">
    <div class="cycles" id="cycles" aria-hidden="true"></div>
    <div class="ctrl-pomodoro__phase" id="pom-phase">Pomodoro</div>
    <div class="ctrl-pomodoro__time" id="pom-time"></div>
  </button>

  <noscript>
    <p style="padding:2rem;font-family:Georgia,serif">JavaScript is required to run the slideshow.</p>
  </noscript>
  <script src="slideshow.js"></script>
</body>
</html>
